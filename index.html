<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Famous Person of the Day</title>

  <!-- CSS loaded dynamically with timestamp to bust cache -->
  <script>
    var t = Date.now();
    document.write('<link rel="stylesheet" href="style.css?' + t + '" />');
  </script>
  <noscript><link rel="stylesheet" href="style.css" /></noscript>
</head>
<body>
  <div class="bg-orbs">
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
    <div class="orb orb3"></div>
  </div>

  <div class="container">
    <div class="badge">🌍 Famous Person Around the World</div>

    <div class="card" id="card">
      <div class="emoji" id="emoji"></div>
      <h1 class="name"  id="name"></h1>
      <div class="field-tag" id="field"></div>
      <div class="known" id="known"></div>
      <div class="years" id="years"></div>
      <hr class="divider" />
      <p class="fact" id="fact"></p>
    </div>

    <div class="actions">
      <button class="btn" onclick="nextPerson()">
        🔀 Next Person
      </button>
      <button class="btn btn-outline" onclick="copyPerson()">
        📋 Copy
      </button>
    </div>

    <div class="counter">
      Showing <span id="num">1</span> of <span id="total"></span> people
    </div>

    
  </div>

  <div class="toast" id="toast">Copied! 📋</div>

  <!-- JS loaded dynamically with timestamp to bust cache -->
  <script>
    var t = Date.now();
    document.write('<script src="data.js?' + t + '"><\/script>');
    document.write('<script src="app.js?' + t + '"><\/script>');
  </script>
</body>
</html>
